AWSTemplateFormatVersion: "2010-09-09"
Description: Control Tower landing zone (version 4.0). Deploy in the Organizations MANAGEMENT account, in the home region, after 00-prerequisites.

Parameters:
  GovernedRegions:
    Type: CommaDelimitedList
  LogArchiveAccountId:
    Type: String
    AllowedPattern: "[0-9]{12}"
    ConstraintDescription: The 12-digit LogArchiveAccountId output of the 00-prerequisites stack.
  AuditAccountId:
    Type: String
    AllowedPattern: "[0-9]{12}"
    ConstraintDescription: The 12-digit AuditAccountId output of the 00-prerequisites stack.
  LogRetentionDays:
    Type: Number
  AccessLogRetentionDays:
    Type: Number
  KmsKeyArn:
    Type: String
    Default: ""
    Description: Optional customer managed key. Its key policy must allow Control Tower, CloudTrail and Config.
  LandingZoneVersion:
    Type: String
    Default: "4.0"

Conditions:
  HasKms: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  # Every service integration needs an explicit "enabled" flag; an enabled one needs its central account id.
  LandingZone:
    Type: AWS::ControlTower::LandingZone
    Properties:
      Version: !Ref LandingZoneVersion
      RemediationTypes: [INHERITANCE_DRIFT]  # accounts moved or created into a registered OU are enrolled automatically
      Manifest:
        governedRegions: !Ref GovernedRegions
        accessManagement:
          enabled: true
        backup:
          enabled: false
        centralizedLogging:
          enabled: true
          accountId: !Ref LogArchiveAccountId
          configurations:
            loggingBucket: {retentionDays: !Ref LogRetentionDays}
            accessLoggingBucket: {retentionDays: !Ref AccessLogRetentionDays}
            kmsKeyArn: !If [HasKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
        securityRoles:
          enabled: true
          accountId: !Ref AuditAccountId
        config:
          enabled: true
          accountId: !Ref AuditAccountId
          configurations:
            loggingBucket: {retentionDays: !Ref LogRetentionDays}
            accessLoggingBucket: {retentionDays: !Ref AccessLogRetentionDays}
            kmsKeyArn: !If [HasKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]

Outputs:
  LandingZoneArn:
    Value: !GetAtt LandingZone.Arn
