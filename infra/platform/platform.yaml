AWSTemplateFormatVersion: "2010-09-09"
Description: Landing Zone Agent — design runs (SOW to IaC) and deploy runs (AWS Transform + attestation).

Parameters:
  ProjectName:
    Type: String
    Default: lz-agent
    AllowedPattern: "[a-z][a-z0-9-]{2,20}"
  CodeBucket:
    Type: String
    Description: Existing bucket holding orchestration.zip, buildspecs.zip and the state machine definitions (scripts/deploy.sh uploads them).
  # CloudFormation only updates a state machine when DefinitionS3Location changes; re-uploading the same key is
  # invisible to it. scripts/deploy.sh uploads each definition under a content-hashed key and passes it here.
  RunStateMachineKey:
    Type: String
    AllowedPattern: "statemachine\\.asl\\.[0-9a-f]{16}\\.json"
    Description: S3 key in CodeBucket of the design-run state machine definition (content-hashed by scripts/deploy.sh).
  DeployStateMachineKey:
    Type: String
    AllowedPattern: "deployment\\.asl\\.[0-9a-f]{16}\\.json"
    Description: S3 key in CodeBucket of the deploy-run state machine definition (content-hashed by scripts/deploy.sh).
  AgentImageUri:
    Type: String
    Default: ""
    Description: ECR image (linux/arm64). Leave empty on the first deploy; push the image, then update the stack.
  AgentRuntimeArn:
    Type: String
    Default: ""
    Description: Optional existing Bedrock AgentCore runtime ARN in this account (skips creating AgentRuntime; do not use cross-account ARNs).
  ModelId:
    Type: String
    Description: Bedrock inference-profile id for the Claude model (verify it in your region before deploying).
  CognitoDomainPrefix:
    Type: String
  BedrockApiKeySecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager secret (plain key or {"apiKey":"..."}) for AWS_BEARER_TOKEN_BEDROCK.
  TransformWorkspaceId:
    Type: String
    MinLength: 1
    Description: AWS Transform workspace UUID for all deploy runs (SigV4; enable Transform on the platform role).
  TransformOrchestratorAgent:
    Type: String
    Default: ""
    Description: Transform orchestrator agent name for landing-zone jobs (recommended).
  EnableCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false when the AWS account is not yet verified for CloudFront (S3 website HTTP UI for PoC).
  DeployAssumeRoleArn:
    Type: String
    Default: "arn:aws:iam::*:role/IngramLandingZoneDeploy*"
    MinLength: 1
    Description: >-
      IAM resource pattern for sts:AssumeRole on cross-account deploy targets (ApiRole for /deploy-target/verify,
      AgentRole for discover/attest). Keep it narrow: name the target role(s), never "*".
  TransformRegion:
    Type: String
    AllowedValues: [us-east-1, eu-central-1, ap-southeast-2, ap-northeast-1, eu-west-2, ap-northeast-2, sa-east-1, ap-south-1, ca-central-1]
    Description: >-
      AWS Transform region of the profile that owns TransformWorkspaceId. Required: an account can have a Transform
      profile per region, so the agent never discovers or guesses it.
  TransformRoleArn:
    Type: String
    Default: ""
    Description: >-
      IAM role the agent assumes for AWS Transform calls (fixed session name). Set it when Transform runs in
      another account (it must share the target's AWS Organization). Empty = AgentRole itself (Transform in this account).
  TransformExternalId:
    Type: String
    Default: ""
    # Not NoEcho: an sts:ExternalId is not a secret (it is a confused-deputy guard, visible in the runtime
    # environment and in the caller's CloudTrail). Do not reuse a secret value here.
    Description: sts:ExternalId required by TransformRoleArn's trust policy (empty when not required). Not a secret.

Conditions:
  HasExternalRuntime: !Not [!Equals [!Ref AgentRuntimeArn, ""]]
  CreateRuntime: !And [!Not [!Equals [!Ref AgentImageUri, ""]], !Not [!Condition HasExternalRuntime]]
  HasBedrockApiKeySecret: !Not [!Equals [!Ref BedrockApiKeySecretArn, ""]]
  HasTransformRole: !Not [!Equals [!Ref TransformRoleArn, ""]]
  NoTransformRole: !Equals [!Ref TransformRoleArn, ""]   # Transform runs in this account as AgentRole itself
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  UseS3WebsiteUi: !Equals [!Ref EnableCloudFront, "false"]

Resources:
  # ---------- Data ----------
  Key:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName} data key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Root
            Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"

  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}, {AttributeName: SK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}, {AttributeName: SK, KeyType: RANGE}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt Key.Arn}
      DeletionProtectionEnabled: true

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: "aws:kms", KMSMasterKeyID: !GetAtt Key.Arn}
      CorsConfiguration:   # browser uploads the SOW with a presigned POST
        CorsRules:
          - AllowedOrigins:
              !If
                - UseCloudFront
                - [!Sub "https://${Distribution.DomainName}"]
                - [!GetAtt Api.ApiEndpoint]   # no-CloudFront mode: UiServeFn serves the UI from the API origin
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          # Backstop only. Deploy-target keys are deleted explicitly (all versions) at DELIVERED, FAILED and /stop;
          # this catches executions that end without reaching MarkFailed (e.g. the SFN execution timeout).
          - Id: ExpireDeployTargetCredentials
            Status: Enabled
            Prefix: deploy-target-credentials/
            ExpirationInDays: 4
            NoncurrentVersionExpiration: {NoncurrentDays: 1}

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
          # Deploy-target access keys: only AgentRole may read them (account admins included in the deny).
          - Sid: DeployTargetCredentialsReadOnlyByAgent
            Effect: Deny
            Principal: "*"
            Action: ["s3:GetObject", "s3:GetObjectVersion"]
            Resource: !Sub "${ArtifactBucket.Arn}/deploy-target-credentials/*"
            Condition: {ArnNotEquals: {"aws:PrincipalArn": !GetAtt AgentRole.Arn}}
          # ...and they must be written with the stack CMK, never aws/s3 or SSE-S3.
          - Sid: DeployTargetCredentialsStackKeyOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:PutObject"
            Resource: !Sub "${ArtifactBucket.Arn}/deploy-target-credentials/*"
            Condition: {StringNotEquals: {"s3:x-amz-server-side-encryption-aws-kms-key-id": !GetAtt Key.Arn}}

  # ---------- UI hosting (S3 + CloudFront OAC, or private S3 + API Gateway when CloudFront unavailable) ----------
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]

  Oac:
    Condition: UseCloudFront
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Condition: UseCloudFront
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt Oac.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled (UI files change on deploy)
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03   # Managed-SecurityHeadersPolicy

  UiBucketPolicy:
    Condition: UseCloudFront
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${UiBucket.Arn}/*"
            Condition: {StringEquals: {"AWS:SourceArn": !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"}}

  # ---------- Auth ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies: {PasswordPolicy: {MinimumLength: 14, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true}}

  # Members may answer AWS Transform questions from the UI (POST /runs/{runId}/answer). Add users by hand:
  # aws cognito-idp admin-add-user-to-group --user-pool-id <pool> --username <email> --group-name transform-approvers
  TransformApproversGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: transform-approvers
      Description: May answer AWS Transform questions for their own deploy runs from the Landing Zone UI.

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: {Domain: !Ref CognitoDomainPrefix, UserPoolId: !Ref UserPool}

  # ---------- Roles ----------
  LambdaLogs:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["logs:CreateLogStream", "logs:PutLogEvents", "logs:CreateLogGroup"]
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*"

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: "2012-10-17", Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}]}
      ManagedPolicyArns: [!Ref LambdaLogs]
      Policies:
        - PolicyName: api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:Query", "dynamodb:Scan"]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: ["states:StartExecution"]
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-run"
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-deploy"
              - Effect: Allow
                Action: ["states:StopExecution"]
                Resource:
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${ProjectName}-run:*"
                  - !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${ProjectName}-deploy:*"
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]   # PutObject: presigned POST for the SOW is signed with this role
                Resource: !Sub "${ArtifactBucket.Arn}/runs/*"
              # Deploy-target keys: write at /deploy, delete (every version) at /stop. No read.
              - Effect: Allow
                Action: ["s3:PutObject", "s3:DeleteObject", "s3:DeleteObjectVersion"]
                Resource: !Sub "${ArtifactBucket.Arn}/deploy-target-credentials/*"
              - Effect: Allow
                Action: ["s3:ListBucketVersions"]
                Resource: !GetAtt ArtifactBucket.Arn
                Condition: {StringLike: {"s3:prefix": "deploy-target-credentials/*"}}
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !GetAtt Key.Arn
              - Effect: Allow
                Action: ["sts:AssumeRole"]
                Resource: !Ref DeployAssumeRoleArn
              # POST /runs/{runId}/answer sends the reply as the Transform identity (TransformRoleArn, session
              # ingram-lz-agent), so the role's trust policy must also allow this role (see ApiRoleArn output).
              - !If
                - HasTransformRole
                - Effect: Allow
                  Action: ["sts:AssumeRole"]
                  Resource: !Ref TransformRoleArn
                - !Ref AWS::NoValue

  PhaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: "2012-10-17", Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}]}
      ManagedPolicyArns: [!Ref LambdaLogs]
      Policies:
        - PolicyName: phase
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:UpdateItem"]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/runs/*"
              # phase_deploy_status deletes deploy-target keys (every version) at DELIVERED/FAILED. No read.
              - Effect: Allow
                Action: ["s3:DeleteObject", "s3:DeleteObjectVersion"]
                Resource: !Sub "${ArtifactBucket.Arn}/deploy-target-credentials/*"
              - Effect: Allow
                Action: ["s3:ListBucketVersions"]
                Resource: !GetAtt ArtifactBucket.Arn
                Condition: {StringLike: {"s3:prefix": "deploy-target-credentials/*"}}
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !GetAtt Key.Arn
              - Effect: Allow
                Action: ["bedrock-agentcore:InvokeAgentRuntime"]
                Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccounts
                  - organizations:ListPolicies
                  - organizations:ListTargetsForPolicy
                Resource: "*"
              - Effect: Allow
                Action: ["controltower:ListLandingZones", "controltower:GetLandingZone"]
                Resource: "*"

  AgentRole:   # AgentCore: SOW intake + full deploy workflow (Orgs discover, Transform API, deployment artifacts)
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: "sts:AssumeRole"
            Condition: {StringEquals: {"aws:SourceAccount": !Ref "AWS::AccountId"}}
          # Self-assume with a fixed session name (lzcore/transform_credentials.py), only when Transform runs in
          # this account (TransformRoleArn empty): Transform keys workspace collaborators by RoleId:SessionName,
          # and AgentCore session names change per run. With TransformRoleArn set this statement is absent.
          # Trade-off: a trust policy cannot reference its own role's ARN (circular), so the principal is matched
          # by the generated-name prefix. We deliberately do NOT set an explicit RoleName to get an exact ARN:
          # changing RoleName replaces the role (new RoleId), which breaks the target-account trust policies and
          # the Transform workspace collaborator mapping that are keyed to the current role. Exposure: a principal
          # allowed to create roles named "<stack>-AgentRole-*" in this account could assume AgentRole.
          # The matching sts:AssumeRole permission (AgentSelfAssumePolicy) uses the exact ARN.
          - !If
            - NoTransformRole
            - Effect: Allow
              Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
              Action: "sts:AssumeRole"
              Condition: {ArnLike: {"aws:PrincipalArn": !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-AgentRole-*"}}
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
                Resource: ["arn:aws:bedrock:*::foundation-model/anthropic.*", !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"]
              - Effect: Allow
                Action: ["ecr:BatchGetImage", "ecr:GetDownloadUrlForLayer"]
                Resource: !GetAtt AgentRepo.Arn
              - Effect: Allow
                Action: ["ecr:GetAuthorizationToken"]
                Resource: "*"
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents", "xray:PutTraceSegments", "xray:PutTelemetryRecords"]
                Resource: "*"
              - Effect: Allow
                Action: ["dynamodb:PutItem", "dynamodb:GetItem", "dynamodb:UpdateItem"]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow
                Action: ["s3:ListBucket"]
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow   # GetObject also authorizes HEAD requests
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/runs/*"
              - Effect: Allow   # deploy-target keys (the bucket policy denies every other reader)
                Action: ["s3:GetObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/deploy-target-credentials/*"
              # AWS Transform, only when Transform runs in this account (TransformRoleArn empty). Exactly the job,
              # workspace, message, HITL-task (read) and artifact (download) operations the workflow and the
              # Transform MCP read paths use; no profile/account/agent-access administration, no workspace or
              # collaborator management, no HITL submission (humans answer in the Transform console).
              # With TransformRoleArn set, AgentRole gets no transform:* at all (the Transform role holds them).
              # Keep in sync with docs/deployment-agent-transform.md ("Transform IAM actions").
              - !If
                - NoTransformRole
                - Effect: Allow
                  Action:
                    - transform:ListWorkspaces
                    - transform:GetWorkspace
                    - transform:CreateJob
                    - transform:StartJob
                    - transform:StopJob
                    - transform:GetJob
                    - transform:ListJobs
                    - transform:ListJobPlanSteps
                    - transform:ListPlanUpdates
                    - transform:ListWorklogs
                    - transform:SendMessage
                    - transform:ListMessages
                    - transform:BatchGetMessage
                    - transform:ListHitlTasks
                    - transform:GetHitlTask
                    - transform:ListArtifacts
                    - transform:CreateArtifactDownloadUrl
                    - transform:CreateAssetDownloadUrl
                    - transform:ListAgents
                    - transform:GetAgent
                    - transform:GetWebAppUrl
                    - transform:AccessTransformProfile
                    - transform:ListProfiles
                  Resource: "*"
                - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - organizations:DescribeOrganization
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListAccounts
                  - organizations:ListPolicies
                  - organizations:ListTargetsForPolicy
                Resource: "*"
              - Effect: Allow
                Action: ["controltower:ListLandingZones", "controltower:GetLandingZone"]
                Resource: "*"
              - Effect: Allow   # cross-account deploy targets (role mode)
                Action: ["sts:AssumeRole"]
                Resource: !Ref DeployAssumeRoleArn
              # Transform in another account: assume exactly TransformRoleArn (not via DeployAssumeRoleArn).
              - !If
                - HasTransformRole
                - Effect: Allow
                  Action: ["sts:AssumeRole"]
                  Resource: !Ref TransformRoleArn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !GetAtt Key.Arn
              - !If
                - HasBedrockApiKeySecret
                - Effect: Allow
                  Action: ["secretsmanager:GetSecretValue"]
                  Resource: !Ref BedrockApiKeySecretArn
                - !Ref AWS::NoValue

  # Self-assume permission for the stable Transform identity (Transform in this account only). A separate
  # policy resource so it can name AgentRole's exact ARN (an inline policy cannot reference its own role).
  AgentSelfAssumePolicy:
    Condition: NoTransformRole
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref AgentRole
      PolicyName: agent-self-assume
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["sts:AssumeRole"]
            Resource: !GetAtt AgentRole.Arn

  UiServeRole:   # no-CloudFront UI: read the UI bucket's files, nothing else
    Condition: UseS3WebsiteUi
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: "2012-10-17", Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}]}
      ManagedPolicyArns: [!Ref LambdaLogs]
      Policies:
        - PolicyName: ui-serve
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject"]
                Resource: !Sub "${UiBucket.Arn}/*"

  ValidateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: "2012-10-17", Statement: [{Effect: Allow, Principal: {Service: codebuild.amazonaws.com}, Action: "sts:AssumeRole"}]}
      Policies:
        - PolicyName: validate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:GetObjectVersion"]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${CodeBucket}/buildspecs.zip"
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/runs/*"
              - Effect: Allow
                Action: ["s3:ListBucket"]
                Resource: !GetAtt ArtifactBucket.Arn
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey"]
                Resource: !GetAtt Key.Arn
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: "*"

  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: "2012-10-17", Statement: [{Effect: Allow, Principal: {Service: states.amazonaws.com}, Action: "sts:AssumeRole"}]}
      Policies:
        - PolicyName: sfn
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["lambda:InvokeFunction"]
                Resource:
                  - !GetAtt PhaseExtractFn.Arn
                  - !GetAtt PhaseInvokeFn.Arn
                  - !GetAtt PhaseRenderFn.Arn
                  - !GetAtt PhaseStatusFn.Arn
                  - !GetAtt PhaseDeployFn.Arn
              - Effect: Allow
                Action: ["codebuild:StartBuild", "codebuild:StopBuild", "codebuild:BatchGetBuilds"]
                Resource: !GetAtt ValidateProject.Arn
              - Effect: Allow   # required by the .sync CodeBuild integration
                Action: ["events:PutTargets", "events:PutRule", "events:DescribeRule"]
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventForCodeBuildStartBuildRule"
              - Effect: Allow
                Action: ["logs:CreateLogDelivery", "logs:PutLogEvents", "logs:UpdateLogDelivery", "logs:DescribeLogGroups", "logs:CreateLogGroup", "logs:DescribeResourcePolicies", "logs:PutResourcePolicy", "logs:GetLogDelivery", "logs:ListLogDeliveries"]
                Resource: "*"

  # ---------- Agent runtime ----------
  AgentRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-agent"
      ImageScanningConfiguration: {ScanOnPush: true}
      ImageTagMutability: IMMUTABLE

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: CreateRuntime
    Properties:
      AgentRuntimeName: !Sub
        - "${Name}_agent"
        - {Name: !Join ["_", !Split ["-", !Ref ProjectName]]}
      Description: SOW scope extraction agent (Strands)
      RoleArn: !GetAtt AgentRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration: {ContainerUri: !Ref AgentImageUri}
      NetworkConfiguration: {NetworkMode: PUBLIC}
      EnvironmentVariables:
        MODEL_ID: !Ref ModelId
        STATE_TABLE: !Ref StateTable
        ARTIFACT_BUCKET: !Ref ArtifactBucket
        BEDROCK_API_KEY_SECRET_ARN: !Ref BedrockApiKeySecretArn
        TRANSFORM_WORKSPACE_ID: !Ref TransformWorkspaceId
        TRANSFORM_REGION: !Ref TransformRegion
        TRANSFORM_ORCHESTRATOR_AGENT: !Ref TransformOrchestratorAgent
        TRANSFORM_ROLE_ARN: !If [HasTransformRole, !Ref TransformRoleArn, !GetAtt AgentRole.Arn]
        TRANSFORM_EXTERNAL_ID: !Ref TransformExternalId

  # ---------- Validation ----------
  ValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-validate"
      ServiceRole: !GetAtt ValidateRole.Arn
      EncryptionKey: !GetAtt Key.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables: [{Name: ARTIFACT_BUCKET, Value: !Ref ArtifactBucket}]
      Source:
        Type: S3
        Location: !Sub "${CodeBucket}/buildspecs.zip"
        BuildSpec: validate.yml
      TimeoutInMinutes: 20

  # ---------- Lambdas ----------
  ApiRunsFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api-runs"
      Runtime: python3.12
      Handler: api_runs.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 29   # /answer: AssumeRole + live question re-read + SendMessage (HTTP API caps integrations at 30 s)
      MemorySize: 512
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-run"
          DEPLOY_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-deploy"
          TRANSFORM_WORKSPACE_ID: !Ref TransformWorkspaceId
          TRANSFORM_REGION: !Ref TransformRegion
          # Empty without TransformRoleArn: /answer then refuses (the agent's self-assumed identity is not shared).
          TRANSFORM_ROLE_ARN: !If [HasTransformRole, !Ref TransformRoleArn, ""]
          TRANSFORM_EXTERNAL_ID: !Ref TransformExternalId
          TRANSFORM_APPROVER_GROUP: !Ref TransformApproversGroup
          DATA_KEY_ARN: !GetAtt Key.Arn   # SSEKMSKeyId for deploy-target credentials (bucket policy enforces it)

  ApiArtifactsFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-api-artifacts"
      Runtime: python3.12
      Handler: api_artifacts.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 15
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment: {Variables: {STATE_TABLE: !Ref StateTable, ARTIFACT_BUCKET: !Ref ArtifactBucket}}

  UiServeFn:
    Condition: UseS3WebsiteUi
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ui-serve"
      Runtime: python3.12
      Handler: ui_serve.handler
      Role: !GetAtt UiServeRole.Arn
      Timeout: 10
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment: {Variables: {UI_BUCKET: !Ref UiBucket}}

  PhaseExtractFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-phase-extract"
      Runtime: python3.12
      Handler: phase_extract.handler
      Role: !GetAtt PhaseRole.Arn
      Timeout: 300
      MemorySize: 1024
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment: {Variables: {STATE_TABLE: !Ref StateTable, ARTIFACT_BUCKET: !Ref ArtifactBucket}}

  PhaseInvokeFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-phase-invoke"
      Runtime: python3.12
      Handler: phase_invoke.handler
      Role: !GetAtt PhaseRole.Arn
      Timeout: 900  # AgentCore deploy/intake + deploy attestation in one invoke
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          AGENT_RUNTIME_ARN:
            !If
              - HasExternalRuntime
              - !Ref AgentRuntimeArn
              - !If [CreateRuntime, !GetAtt AgentRuntime.AgentRuntimeArn, ""]

  PhaseRenderFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-phase-render"
      Runtime: python3.12
      Handler: phase_render.handler
      Role: !GetAtt PhaseRole.Arn
      Timeout: 120
      MemorySize: 512
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment: {Variables: {STATE_TABLE: !Ref StateTable, ARTIFACT_BUCKET: !Ref ArtifactBucket}}

  PhaseStatusFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-phase-status"
      Runtime: python3.12
      Handler: phase_status.handler
      Role: !GetAtt PhaseRole.Arn
      Timeout: 15
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment: {Variables: {STATE_TABLE: !Ref StateTable, ARTIFACT_BUCKET: !Ref ArtifactBucket}}

  PhaseDeployFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-phase-deploy"
      Runtime: python3.12
      Handler: phase_deploy_status.handler
      Role: !GetAtt PhaseRole.Arn
      Timeout: 120
      MemorySize: 512
      Code: {S3Bucket: !Ref CodeBucket, S3Key: orchestration.zip}
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          ARTIFACT_BUCKET: !Ref ArtifactBucket

  # ---------- Orchestration ----------
  SfnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/aws/vendedlogs/states/${ProjectName}", RetentionInDays: 365}

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-run"
      RoleArn: !GetAtt SfnRole.Arn
      DefinitionS3Location: {Bucket: !Ref CodeBucket, Key: !Ref RunStateMachineKey}
      DefinitionSubstitutions:
        PhaseExtractArn: !GetAtt PhaseExtractFn.Arn
        PhaseInvokeArn: !GetAtt PhaseInvokeFn.Arn
        PhaseRenderArn: !GetAtt PhaseRenderFn.Arn
        PhaseStatusArn: !GetAtt PhaseStatusFn.Arn
        ValidateProject: !Ref ValidateProject
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: false
        Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt SfnLogGroup.Arn}}]

  DeployStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${ProjectName}-deploy"
      RoleArn: !GetAtt SfnRole.Arn
      DefinitionS3Location: {Bucket: !Ref CodeBucket, Key: !Ref DeployStateMachineKey}
      DefinitionSubstitutions:
        PhaseDeployArn: !GetAtt PhaseDeployFn.Arn
        PhaseInvokeArn: !GetAtt PhaseInvokeFn.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: false
        Destinations: [{CloudWatchLogsLogGroup: {LogGroupArn: !GetAtt SfnLogGroup.Arn}}]

  # ---------- API ----------
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-api"
      ProtocolType: HTTP
      # CloudFront mode: the UI origin is the distribution. No-CloudFront mode: UiServeFn serves the UI from this
      # API's own origin, so browser calls are same-origin and need no CORS (and the API cannot name its own
      # endpoint here without a circular reference). Either way, never "*".
      CorsConfiguration:
        !If
          - UseCloudFront
          - AllowOrigins: [!Sub "https://${Distribution.DomainName}"]
            AllowHeaders: [authorization, content-type]
            AllowMethods: [GET, POST, OPTIONS]
          - !Ref AWS::NoValue

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      # The React UI (web/) is served by CloudFront at /v2/index.html next to the classic UI at /.
      CallbackURLs:
        !If
          - UseCloudFront
          - [!Sub "https://${Distribution.DomainName}/", !Sub "https://${Distribution.DomainName}/v2/index.html"]
          - [!Sub "${Api.ApiEndpoint}/"]
      LogoutURLs:
        !If
          - UseCloudFront
          - [!Sub "https://${Distribution.DomainName}/", !Sub "https://${Distribution.DomainName}/v2/index.html"]
          - [!Sub "${Api.ApiEndpoint}/"]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes}

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      Name: cognito
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  RunsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref Api, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt ApiRunsFn.Arn, PayloadFormatVersion: "2.0"}
  ArtifactsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref Api, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt ApiArtifactsFn.Arn, PayloadFormatVersion: "2.0"}
  UiIntegration:
    Condition: UseS3WebsiteUi
    Type: AWS::ApiGatewayV2::Integration
    Properties: {ApiId: !Ref Api, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt UiServeFn.Arn, PayloadFormatVersion: "2.0"}

  RouteCreateRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteListRuns:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /runs", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteStartRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/start", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteDeployRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/deploy", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteStopRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/stop", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteAnswerRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/answer", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteResumeRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/resume", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteDecideTask:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /runs/{runId}/decision", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteVerifyDeployTarget:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "POST /deploy-target/verify", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteGetRun:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /runs/{runId}", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteScope:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /runs/{runId}/scope", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteAudit:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /runs/{runId}/audit", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${RunsIntegration}"}
  RouteArtifact:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /runs/{runId}/artifacts/{name}", AuthorizationType: JWT, AuthorizerId: !Ref Authorizer, Target: !Sub "integrations/${ArtifactsIntegration}"}
  RouteUiRoot:
    Condition: UseS3WebsiteUi
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /", AuthorizationType: NONE, Target: !Sub "integrations/${UiIntegration}"}
  RouteUiIndex:
    Condition: UseS3WebsiteUi
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /index.html", AuthorizationType: NONE, Target: !Sub "integrations/${UiIntegration}"}
  RouteUiAppJs:
    Condition: UseS3WebsiteUi
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /app.js", AuthorizationType: NONE, Target: !Sub "integrations/${UiIntegration}"}
  RouteUiConfig:
    Condition: UseS3WebsiteUi
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: "GET /config.json", AuthorizationType: NONE, Target: !Sub "integrations/${UiIntegration}"}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10}

  PermRuns:
    Type: AWS::Lambda::Permission
    Properties: {Action: "lambda:InvokeFunction", FunctionName: !Ref ApiRunsFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"}
  PermArtifacts:
    Type: AWS::Lambda::Permission
    Properties: {Action: "lambda:InvokeFunction", FunctionName: !Ref ApiArtifactsFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"}
  PermUiServe:
    Condition: UseS3WebsiteUi
    Type: AWS::Lambda::Permission
    Properties: {Action: "lambda:InvokeFunction", FunctionName: !Ref UiServeFn, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"}

Outputs:
  ApiRoleArn:
    Description: Add this principal to the Transform role's trust policy so UI answers can be sent (POST /runs/{runId}/answer).
    Value: !GetAtt ApiRole.Arn
  TransformApproverGroup:
    Description: Cognito group whose members may answer AWS Transform questions from the UI.
    Value: !Ref TransformApproversGroup
  UiUrl:
    Value:
      !If
        - UseCloudFront
        - !Sub "https://${Distribution.DomainName}"
        - !GetAtt Api.ApiEndpoint
  UiBucketName: {Value: !Ref UiBucket}
  EnableCloudFront: {Value: !Ref EnableCloudFront}
  ApiUrl: {Value: !GetAtt Api.ApiEndpoint}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  CognitoDomain: {Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"}
  AgentRepoUri: {Value: !GetAtt AgentRepo.RepositoryUri}
  AgentRuntimeArnInUse:
    Value:
      !If
        - HasExternalRuntime
        - !Ref AgentRuntimeArn
        - !If [CreateRuntime, !GetAtt AgentRuntime.AgentRuntimeArn, ""]
